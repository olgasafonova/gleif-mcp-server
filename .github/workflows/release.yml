name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build MCPB bundles
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist/mcpb

          platforms=(
            "darwin arm64 darwin-arm64 darwin"
            "darwin amd64 darwin-amd64 darwin"
            "linux amd64 linux-amd64 linux"
            "linux arm64 linux-arm64 linux"
            "windows amd64 windows-amd64 win32"
          )

          for platform in "${platforms[@]}"; do
            read -r GOOS GOARCH suffix mcpb_platform <<< "$platform"

            binary_name="gleif-mcp-server"
            if [ "$GOOS" = "windows" ]; then
              binary_name="gleif-mcp-server.exe"
            fi

            bundle_dir="dist/mcpb/gleif-mcp-server-$suffix"
            mkdir -p "$bundle_dir"

            echo "Building $GOOS/$GOARCH..."
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="-s -w" -o "$bundle_dir/$binary_name" .

            # Create platform-specific manifest
            jq --arg platform "$mcpb_platform" --arg version "$VERSION" \
               '.compatibility.platforms = [$platform] | .version = $version' \
               manifest.json > "$bundle_dir/manifest.json"

            # Create .mcpb bundle (zip)
            (cd "$bundle_dir" && zip -r "../gleif-mcp-server-$suffix.mcpb" .)

            # Cleanup temp directory
            rm -rf "$bundle_dir"
          done

          echo "MCPB bundles created:"
          ls -la dist/mcpb/

      - name: Calculate SHA256 hashes
        id: hashes
        run: |
          cd dist/mcpb

          darwin_arm64=$(sha256sum gleif-mcp-server-darwin-arm64.mcpb | cut -d' ' -f1)
          darwin_amd64=$(sha256sum gleif-mcp-server-darwin-amd64.mcpb | cut -d' ' -f1)
          linux_amd64=$(sha256sum gleif-mcp-server-linux-amd64.mcpb | cut -d' ' -f1)
          linux_arm64=$(sha256sum gleif-mcp-server-linux-arm64.mcpb | cut -d' ' -f1)
          windows_amd64=$(sha256sum gleif-mcp-server-windows-amd64.mcpb | cut -d' ' -f1)

          echo "darwin_arm64=$darwin_arm64" >> $GITHUB_OUTPUT
          echo "darwin_amd64=$darwin_amd64" >> $GITHUB_OUTPUT
          echo "linux_amd64=$linux_amd64" >> $GITHUB_OUTPUT
          echo "linux_arm64=$linux_arm64" >> $GITHUB_OUTPUT
          echo "windows_amd64=$windows_amd64" >> $GITHUB_OUTPUT

          echo "SHA256 hashes:"
          sha256sum *.mcpb

      - name: Generate server.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${GITHUB_REF_NAME}"

          cat > dist/server.json << EOF
          {
            "\$schema": "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json",
            "name": "io.github.olgasafonova/gleif-mcp-server",
            "title": "GLEIF MCP Server",
            "description": "Access the GLEIF LEI database for company verification, KYC, and ownership research.",
            "version": "$VERSION",
            "websiteUrl": "https://github.com/olgasafonova/gleif-mcp-server",
            "repository": {
              "url": "https://github.com/olgasafonova/gleif-mcp-server",
              "source": "github"
            },
            "packages": [
              {
                "registryType": "oci",
                "identifier": "ghcr.io/olgasafonova/gleif-mcp-server:$VERSION",
                "version": "$VERSION",
                "transport": {"type": "stdio"}
              },
              {
                "registryType": "mcpb",
                "identifier": "https://github.com/olgasafonova/gleif-mcp-server/releases/download/$TAG/gleif-mcp-server-darwin-arm64.mcpb",
                "version": "$VERSION",
                "fileSha256": "${{ steps.hashes.outputs.darwin_arm64 }}",
                "transport": {"type": "stdio"}
              },
              {
                "registryType": "mcpb",
                "identifier": "https://github.com/olgasafonova/gleif-mcp-server/releases/download/$TAG/gleif-mcp-server-darwin-amd64.mcpb",
                "version": "$VERSION",
                "fileSha256": "${{ steps.hashes.outputs.darwin_amd64 }}",
                "transport": {"type": "stdio"}
              },
              {
                "registryType": "mcpb",
                "identifier": "https://github.com/olgasafonova/gleif-mcp-server/releases/download/$TAG/gleif-mcp-server-linux-amd64.mcpb",
                "version": "$VERSION",
                "fileSha256": "${{ steps.hashes.outputs.linux_amd64 }}",
                "transport": {"type": "stdio"}
              },
              {
                "registryType": "mcpb",
                "identifier": "https://github.com/olgasafonova/gleif-mcp-server/releases/download/$TAG/gleif-mcp-server-linux-arm64.mcpb",
                "version": "$VERSION",
                "fileSha256": "${{ steps.hashes.outputs.linux_arm64 }}",
                "transport": {"type": "stdio"}
              },
              {
                "registryType": "mcpb",
                "identifier": "https://github.com/olgasafonova/gleif-mcp-server/releases/download/$TAG/gleif-mcp-server-windows-amd64.mcpb",
                "version": "$VERSION",
                "fileSha256": "${{ steps.hashes.outputs.windows_amd64 }}",
                "transport": {"type": "stdio"}
              }
            ]
          }
          EOF

          echo "Generated server.json:"
          cat dist/server.json

      - name: Upload MCPB bundles to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/mcpb/*.mcpb --clobber

      - name: Wait for Docker image
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IMAGE="ghcr.io/olgasafonova/gleif-mcp-server:${VERSION}"
          echo "Waiting for Docker image: $IMAGE"

          for i in {1..30}; do
            if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
              echo "Docker image available!"
              exit 0
            fi
            echo "Attempt $i/30: Image not ready, waiting 30s..."
            sleep 30
          done

          echo "Error: Docker image not available after 15 minutes"
          exit 1

      - name: Wait for release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Waiting for release binaries..."

          for i in {1..20}; do
            COUNT=$(gh release view "v${VERSION}" --json assets --jq '.assets | length')
            if [ "$COUNT" -ge 5 ]; then
              echo "Release has $COUNT assets, ready!"
              exit 0
            fi
            echo "Attempt $i/20: Only $COUNT assets, waiting 15s..."
            sleep 15
          done

          echo "Error: Release binaries not ready after 5 minutes"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          cd dist
          ../mcp-publisher publish
